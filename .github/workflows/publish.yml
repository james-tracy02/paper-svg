# Publishes to npm when a version tag is pushed. To release:
#   npm version patch   (or minor / major)
#   git push --follow-tags
#
# Authenticates with npm trusted publishing, so no token is stored in the repository.
# npm matches this file's name, so update the trusted publisher on npmjs.com if it is renamed.
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      - run: npm ci

      # prepublishOnly runs the typecheck, tests and build first.
      - run: npm publish
